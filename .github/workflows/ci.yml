name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      # CI 无 DeepSeek Key：强制 Mock 适配器，保证全离线可跑
      DSH_MODEL_ADAPTER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -> dist)
        run: npm run build

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Smoke / --version
        run: node dist/cli.js --version

      - name: Smoke / --help
        run: node dist/cli.js --help

      - name: Smoke / --dump-config
        run: node dist/cli.js --profile web --dump-config

      - name: Smoke / --dump-config-schema
        run: node dist/cli.js --dump-config-schema

      - name: Smoke / headless (offline mock)
        run: node dist/cli.js --profile headless "hello from CI"

      - name: Smoke / headless --json
        run: node dist/cli.js --profile headless --json "json smoke"

      - name: Smoke / stdin task
        run: echo "stdin smoke" | node dist/cli.js --profile headless -

      - name: Smoke / session resume
        run: |
          node dist/cli.js --profile headless --json "first" > /tmp/dsh-first.ndjson
          SID=$(grep -o '"sessionId":"[^"]*"' /tmp/dsh-first.ndjson | sed -n '1p' | cut -d'"' -f4)
          node dist/cli.js --profile headless --session-id "$SID" "second"

      - name: Smoke / plugin manager
        run: node dist/cli.js plugin --profile headless list
