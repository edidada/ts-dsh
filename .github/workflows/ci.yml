name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -> dist)
        run: npm run build

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Smoke / --version
        run: node dist/cli.js --version

      - name: Smoke / --help
        run: node dist/cli.js --help

      - name: Smoke / --dump-config
        run: node dist/cli.js --profile web --dump-config

      - name: Smoke / --dump-config-schema
        run: node dist/cli.js --dump-config-schema
